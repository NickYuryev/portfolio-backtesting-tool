services:
  dashboard:
    build: .
    ports:
      - "8050:8050"
    environment:
      - MPLCONFIGDIR=/tmp/.matplotlib
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8050')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
